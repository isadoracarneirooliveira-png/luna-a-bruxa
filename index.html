<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna: A Guardiã das Estrelas</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            margin-bottom: 6px;
        }
        p {
            color: #e0c3fc;
            margin-top: 0;
            font-size: 15px;
        }
        canvas {
            background-color: #0f071c;
            border: 4px solid #ffd700;
            border-radius: 14px;
            box-shadow: 0 0 30px rgba(186, 104, 200, 0.5);
            margin-top: 8px;
        }
        #message {
            font-size: 24px;
            font-weight: bold;
            margin: 14px 0;
            min-height: 32px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        #restartBtn {
            display: none;
            margin: 8px auto;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff7eb3, #ff758c);
            color: white;
            border: 2px solid #fff;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.5);
            transition: transform 0.15s;
        }
        #restartBtn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>✨ Luna: A Guardiã das Estrelas ✨</h1>
    <p><b>A / D</b> ou <b>Setas</b> para andar | <b>W / Espaço</b> (2x) Pulo Duplo | <b>F</b> Raio Estelar | <b>R</b> Supernova</p>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="message"></div>
    <button id="restartBtn" onclick="reiniciarJogo()">Jogar Novamente ✨</button>

    <script src="script.js"></script>
</body>
</html>
